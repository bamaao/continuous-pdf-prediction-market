description = "Dual-copy fill journal. Commit trades_root is a checkpoint, not fill existence (FR-DUR)."

[lib]
name = "journal"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
