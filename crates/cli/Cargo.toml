[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Localnet CLI: create / deposit / buy-set / risk bid / resolve / settle. FR-CLI-01."

[[bin]]
name = "cpm"
path = "src/main.rs"

[dependencies]
