[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Localnet CLI: create / deposit / buy-set / risk bid / resolve / settle. FR-CLI-01."

[[bin]]
name = "cpm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = { version = "0.22", features = ["std"] }
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["json"] }
bincode = "1"
client = { path = "../client" }
quote = { path = "../services/quote" }
serde_json = "1"
solana-client = "2.2"
solana-sdk = "2.2"
