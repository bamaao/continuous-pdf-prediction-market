[package]
name = "market"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "L1 market create-by-family and L1-test buy_set/sell_set. Family locked. p0 written once."

[lib]
crate-type = ["cdylib", "lib"]
name = "market"

[features]
default = []
idl-build = ["anchor-lang/idl-build", "vault/idl-build"]
no-entrypoint = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor-compat"] }
# CR-04: MagicBlock / GPL SessionToken. Protocol Session PDA still owns remaining_usdc / allowed_ix.
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }
math = { path = "../../crates/math" }
vault = { path = "../vault", default-features = false, features = ["cpi"] }
