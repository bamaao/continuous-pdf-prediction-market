[package]
name = "risk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "L1 risk auction: published layers, quote, lock >= D, lowest unit premium. Never Delegates."

[lib]
crate-type = ["cdylib", "lib"]
name = "risk"

[features]
default = []
idl-build = ["anchor-lang/idl-build", "market/idl-build", "vault/idl-build"]
no-entrypoint = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
bytemuck = { version = "1", features = ["derive"] }
market = { path = "../market", default-features = false, features = ["cpi"] }
math = { path = "../../crates/math" }
vault = { path = "../vault", default-features = false, features = ["cpi"] }
